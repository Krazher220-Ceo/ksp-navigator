[pytest]
; Без этого файла "pytest tests/..." не находит пакеты core/, bot/, web/ —
; при отсутствии tests/__init__.py pytest подставляет в sys.path только
; папку tests/, а не корень проекта. python -m pytest работал случайно
; (там cwd попадает в sys.path автоматически), обычный "pytest" — нет.
pythonpath = .
; Б2 вводит первые async-тесты (core/llm_client.py); auto избавляет от
; необходимости вешать @pytest.mark.asyncio на каждый — забыть его и
; молча получить пропущенный тест иначе легко.
asyncio_mode = auto
; Э2 (PLAN.md): tests/test_supabase_contract.py требует сети и настоящего
; Supabase — тот же класс проблем, от которого ушёл блок Н0. "-m not
; supabase" держит его вне обычного "pytest -q"/"pytest"; явный запуск —
; "pytest -m supabase". markers= регистрирует метку, чтобы pytest не
; предупреждал про неизвестный маркер при обычном прогоне.
addopts = -m "not supabase"
markers =
    supabase: требует сети и настоящего Supabase; pytest -q его не запускает, только явный "pytest -m supabase"
